[package]
name = "networkkit"
version = "27.0.0"
edition = "2021"
license = "TCL"
description = "Network framework for TontooOS - Bluetooth, WiFi and local network discovery via Linux"
authors = ["arlomu"]

[lib]
crate-type = ["cdylib", "rlib"]
name = "networkkit"
path = "src/lib.rs"

[[example]]
name = "test_bluetooth"
path = "examples/test_bluetooth.rs"

[[example]]
name = "test_wifi"
path = "examples/test_wifi.rs"

[[example]]
name = "test_local_network"
path = "examples/test_local_network.rs"

[[example]]
name = "test_http"
path = "examples/test_http.rs"

# ureq keeps rustls (TLS); the "json" feature is dropped, JSON goes
# through Foundation. Async wrappers use foundation::async_runtime.
[dependencies]
foundation = { path = "../Foundation" }
ureq = { version = "3", features = ["rustls"] }
